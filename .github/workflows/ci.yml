name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build & Test
        run: |
          set -o pipefail
          # SnapshotGalleryTests is a docs/screenshots/ generator that lives in
          # the test target for convenience (NSHostingView + sandbox cache
          # output). It has no assertions and its PNGs go nowhere useful in
          # CI, so we skip it here — regenerate manually via
          # `scripts/generate-snapshots.sh` when the manual needs updating.
          xcodebuild test \
            -project Panely.xcodeproj \
            -scheme Panely \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:PanelyTests/SnapshotGalleryTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES
