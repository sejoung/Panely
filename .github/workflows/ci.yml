name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    env:
      PANELY_DERIVED_DATA_PATH: ${{ runner.temp }}/PanelyDerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ${{ runner.temp }}/PanelyDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build & Test
        run: |
          # Fast tier only. SnapshotGalleryTests (scripts/generate-snapshots.sh),
          # VisualRegressionTests (scripts/test-visual.sh) and the slow tier
          # (scripts/test-slow.sh) are opt-in; see PanelyTests/TestTiers.swift.
          python3 -m unittest discover -s scripts/tests -p 'test_test_runner.py'
          scripts/test.sh --results-dir build/ci-test-results

      # Debug on the host does not exercise the optimized Intel code path.
      - name: Verify universal Release build
        run: scripts/check-release.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-results-${{ github.run_attempt }}
          path: |
            build/ci-test-results
            build/release-checks
          retention-days: 7
